version: "3.9"

x-deploy-defaults: &deploy-defaults
  mode: replicated
  replicas: 1
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 30s
  update_config:
    parallelism: 1
    delay: 5s
    order: start-first
    failure_action: rollback
  rollback_config:
    parallelism: 1
    order: stop-first
  placement:
    constraints:
      - node.hostname == build1

services:
  yahoo-mail-mcp:
    deploy:
      <<: *deploy-defaults
    image: registry:5000/offbeat-iot/yahoo-mail-mcp:latest
    environment:
      - IMAP_HOST=imap.mail.yahoo.com
      - IMAP_PORT=993
      - IMAP_SECURE=true
      - SMTP_HOST=smtp.mail.yahoo.com
      - SMTP_PORT=465
      - SMTP_SECURE=true
      - EMAIL_USER=${YAHOO_EMAIL}
      - EMAIL_PASS=${YAHOO_APP_PASSWORD}
    ports:
      - target: 3101
        published: 3101
        protocol: tcp
        mode: ingress
    networks:
      - mcp-network

  alertmanager-mcp:
    deploy:
      <<: *deploy-defaults
      replicas: ${ALERTMANAGER_MCP_REPLICAS:-0}
    image: ghcr.io/ntk148v/alertmanager-mcp-server:1.1.0
    environment:
      - ALERTMANAGER_URL=${ALERTMANAGER_URL}
      - ALERTMANAGER_USERNAME=${ALERTMANAGER_USERNAME:-}
      - ALERTMANAGER_PASSWORD=${ALERTMANAGER_PASSWORD:-}
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
    ports:
      - target: 8001
        published: 8001
        protocol: tcp
        mode: ingress
    extra_hosts:
      - "observability1:192.168.1.80"
    networks:
      - mcp-network

  google-workspace-mcp:
    deploy:
      <<: *deploy-defaults
    image: registry:5000/offbeat-iot/google-workspace-mcp:latest
    command:
      - node
      - dist/server.js
      - --gauth-file
      - /data/google-workspace/.gauth.json
      - --accounts-file
      - /data/google-workspace/.accounts.json
      - --credentials-dir
      - /data/google-workspace/credentials
    environment:
      - TRANSPORT_MODE=sse
      - PORT=3103
    ports:
      - target: 3103
        published: 3103
        protocol: tcp
        mode: ingress
    volumes:
      - ${MCP_DATA_DIR:-/home/jenkins/mcp-server-setup-data}/google-workspace:/data/google-workspace
    networks:
      - mcp-network

  tado-mcp:
    deploy:
      <<: *deploy-defaults
    image: registry:5000/offbeat-iot/tado-mcp:latest
    environment:
      - SERVER_PORT=3102
      - TADO_TOKENS_FILE=/data/tokens.json
    ports:
      - target: 3102
        published: 3102
        protocol: tcp
        mode: ingress
    volumes:
      - ${MCP_DATA_DIR:-/home/jenkins/mcp-server-setup-data}/tado:/data
    networks:
      - mcp-network

  signal-proxy:
    deploy:
      <<: *deploy-defaults
    image: bbernhard/signal-cli-rest-api:latest
    environment:
      - MODE=${SIGNAL_CLI_MODE:-json-rpc-native}
      - RECEIVE_WEBHOOK_URL=${SIGNAL_RECEIVE_WEBHOOK_URL:-http://build1:18442/api/signal/webhook}
    volumes:
      - ${MCP_DATA_DIR:-/home/jenkins/mcp-server-setup-data}/signal-cli:/home/.local/share/signal-cli
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    networks:
      - mcp-network

  signal-mcp:
    deploy:
      <<: *deploy-defaults
    image: registry:5000/offbeat-iot/signal-mcp:latest
    environment:
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3107
      - SIGNAL_BASE_URL=${SIGNAL_BASE_URL:-http://signal-proxy:8080}
      - SENTINEL_WEBHOOK_URL=${SENTINEL_WEBHOOK_URL:-}
      - SIGNAL_NUMBER=${SIGNAL_NUMBER:-+4522386548}
      - SIGNAL_POLL_ENABLED=${SIGNAL_POLL_ENABLED:-true}
      - SIGNAL_POLL_INTERVAL_SECONDS=${SIGNAL_POLL_INTERVAL_SECONDS:-10}
      - SIGNAL_POLL_TIMEOUT_SECONDS=${SIGNAL_POLL_TIMEOUT_SECONDS:-5}
    ports:
      - target: 3107
        published: 3107
        protocol: tcp
        mode: ingress
    networks:
      - mcp-network

  slack-mcp:
    deploy:
      <<: *deploy-defaults
    image: registry:5000/offbeat-iot/slack-mcp:latest
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_DEFAULT_REPLY_TIMEOUT_SECONDS=${SLACK_DEFAULT_REPLY_TIMEOUT_SECONDS:-300}
      - SLACK_REPLY_POLL_INTERVAL_SECONDS=${SLACK_REPLY_POLL_INTERVAL_SECONDS:-5}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3108
    ports:
      - target: 3108
        published: 3108
        protocol: tcp
        mode: ingress
    networks:
      - mcp-network

  todoist-mcp:
    deploy:
      <<: *deploy-defaults
    image: registry:5000/offbeat-iot/todoist-mcp:latest
    command:
      - python
      - -c
      - from todoist_mcp_server.todoist import mcp; from mcp.server.transport_security import TransportSecuritySettings; mcp.settings.host='0.0.0.0'; mcp.settings.port=3104; mcp.settings.transport_security=TransportSecuritySettings(enable_dns_rebinding_protection=False); mcp.run(transport='sse')
    environment:
      - TODOIST_API_TOKEN=${TODOIST_API_TOKEN}
    ports:
      - target: 3104
        published: 3104
        protocol: tcp
        mode: ingress
    networks:
      - mcp-network

  asus-router-mcp:
    deploy:
      <<: *deploy-defaults
    image: registry:5000/offbeat-iot/asus-router-mcp:latest
    environment:
      - ROUTER_HOST=${ROUTER_HOST:-192.168.1.2}
      - ROUTER_HOSTS=${ROUTER_HOSTS:-}
      - ROUTER_PROFILE=${ROUTER_PROFILE:-default}
      - ROUTER_USERNAME=${ROUTER_USERNAME:-admin}
      - ROUTER_PASSWORD=${ROUTER_PASSWORD}
      - USE_SSL=${USE_SSL:-true}
      - TRANSPORT_MODE=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3105
    ports:
      - target: 3105
        published: 3105
        protocol: tcp
        mode: ingress
    networks:
      - mcp-network

  playwright-mcp:
    deploy:
      <<: *deploy-defaults
    image: mcr.microsoft.com/playwright/mcp:latest
    command:
      - --host
      - 0.0.0.0
      - --port
      - "3106"
      - --allowed-hosts
      - "*"
    environment:
      - PLAYWRIGHT_MCP_HOST=0.0.0.0
      - PLAYWRIGHT_MCP_PORT=3106
    ports:
      - target: 3106
        published: 3106
        protocol: tcp
        mode: ingress
    volumes:
      - ${MCP_DATA_DIR:-/home/jenkins/mcp-server-setup-data}/playwright:/home/user
    networks:
      - mcp-network

  jenkins-mcp:
    deploy:
      <<: *deploy-defaults
    image: registry:5000/offbeat-iot/jenkins-mcp:latest
    environment:
      - JENKINS_URL=${JENKINS_URL}
      - JENKINS_USERNAME=${JENKINS_USERNAME}
      - JENKINS_API_TOKEN=${JENKINS_API_TOKEN}
      - MCP_PORT=3117
    ports:
      - target: 3117
        published: 3117
        protocol: tcp
        mode: ingress
    extra_hosts:
      - "monitor:192.168.1.60"
    networks:
      - mcp-network

  portainer-build1:
    deploy:
      <<: *deploy-defaults
    image: registry:5000/offbeat-iot/portainer-mcp:latest
    environment:
      - PORTAINER_BASE_URL=http://build1.home:6500
      - PORTAINER_TOKEN=${PORTAINER_BUILD1_TOKEN}
      - MCP_PORT=3111
    ports:
      - target: 3111
        published: 3111
        protocol: tcp
        mode: ingress
    extra_hosts:
      - "build1.home:192.168.1.10"
    networks:
      - mcp-network

  portainer-build2:
    deploy:
      <<: *deploy-defaults
    image: registry:5000/offbeat-iot/portainer-mcp:latest
    environment:
      - PORTAINER_BASE_URL=http://build2.home:6500
      - PORTAINER_TOKEN=${PORTAINER_BUILD2_TOKEN}
      - MCP_PORT=3112
    ports:
      - target: 3112
        published: 3112
        protocol: tcp
        mode: ingress
    extra_hosts:
      - "build2.home:192.168.1.11"
    networks:
      - mcp-network

  portainer-monitor:
    deploy:
      <<: *deploy-defaults
    image: registry:5000/offbeat-iot/portainer-mcp:latest
    environment:
      - PORTAINER_BASE_URL=http://192.168.1.60:6500
      - PORTAINER_TOKEN=${PORTAINER_MONITOR_TOKEN}
      - MCP_PORT=3113
    ports:
      - target: 3113
        published: 3113
        protocol: tcp
        mode: ingress
    networks:
      - mcp-network

  portainer-observability1:
    deploy:
      <<: *deploy-defaults
    image: registry:5000/offbeat-iot/portainer-mcp:latest
    environment:
      - PORTAINER_BASE_URL=http://192.168.1.80:6500
      - PORTAINER_TOKEN=${PORTAINER_OBSERVABILITY1_TOKEN}
      - MCP_PORT=3114
    ports:
      - target: 3114
        published: 3114
        protocol: tcp
        mode: ingress
    networks:
      - mcp-network

  portainer-tools1:
    deploy:
      <<: *deploy-defaults
    image: registry:5000/offbeat-iot/portainer-mcp:latest
    environment:
      - PORTAINER_BASE_URL=http://192.168.1.17:6500
      - PORTAINER_TOKEN=${PORTAINER_TOOLS1_TOKEN}
      - MCP_PORT=3115
    ports:
      - target: 3115
        published: 3115
        protocol: tcp
        mode: ingress
    networks:
      - mcp-network

  portainer-production1:
    deploy:
      <<: *deploy-defaults
    image: registry:5000/offbeat-iot/portainer-mcp:latest
    environment:
      - PORTAINER_BASE_URL=http://192.168.1.85:6500
      - PORTAINER_TOKEN=${PORTAINER_PRODUCTION1_TOKEN}
      - MCP_PORT=3116
    ports:
      - target: 3116
        published: 3116
        protocol: tcp
        mode: ingress
    networks:
      - mcp-network

  headroom-proxy:
    deploy:
      <<: *deploy-defaults
    image: ghcr.io/chopratejas/headroom:latest
    environment:
      - HEADROOM_HOST=0.0.0.0
      # Point at your LLM provider. Defaults to OpenAI.
      # - OPENAI_TARGET_API_URL=${HEADROOM_TARGET_API_URL:-}
    ports:
      - target: 8787
        published: 8787
        protocol: tcp
        mode: ingress
    healthcheck:
      # The upstream headroom image does not ship curl, so the previous
      # `curl /readyz` probe always failed and Swarm killed the healthy task.
      # Keep the port published and let the image's own logs report readiness.
      disable: true
    volumes:
      - ${MCP_DATA_DIR:-/home/jenkins/mcp-server-setup-data}/headroom:/data
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: overlay
